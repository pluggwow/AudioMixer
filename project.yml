# XcodeGen-манифест. Позволяет получить .xcodeproj одной командой,
# не держа бинарный проектный файл в git.
#
#   brew install xcodegen && xcodegen generate && open AudioMixer.xcodeproj

name: AudioMixer
options:
  bundleIdPrefix: com.example
  # Язык разработки — русский: ключи строк это сами русские фразы.
  # Английский лежит переводом в каталогах Resources/*.xcstrings, и macOS
  # выбирает его сама по языку системы.
  developmentLanguage: ru
  deploymentTarget:
    macOS: "14.4"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.4"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_ENTITLEMENTS: Resources/AudioMixer.entitlements
    ENABLE_APP_SANDBOX: NO
    MARKETING_VERSION: "0.2.1"
    CURRENT_PROJECT_VERSION: "3"
    ARCHS: "$(ARCHS_STANDARD)"   # arm64 + x86_64

targets:
  AudioMixer:
    type: application
    platform: macOS
    sources:
      - path: Sources
      # Иконка приложения. Рисуется генератором Tools/GenerateAppIcon.swift,
      # чтобы все десять размеров выходили из одного источника, а не из
      # ручного масштабирования картинки.
      - path: Resources/Assets.xcassets
      # Каталоги строк. Localizable — интерфейс, InfoPlist — текст системного
      # диалога запроса доступа к звуку: его иностранец видит первым.
      - path: Resources/Localizable.xcstrings
      - path: Resources/InfoPlist.xcstrings
    # Блока info: здесь намеренно нет. Он не «указывает на файл», а ГЕНЕРИРУЕТ
    # его — то есть каждый `xcodegen generate` затирал наш Resources/Info.plist
    # вместе с NSAudioCaptureUsageDescription, без которого система убивает
    # процесс при первой попытке создать process tap. Путь к плисту задаётся
    # ниже через INFOPLIST_FILE, и этого достаточно.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.AudioMixer
        PRODUCT_NAME: AudioMixer
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        # Из C приходит только атомарное чтение и запись Float для
        # realtime-потока, см. Sources/Utilities/AudioMixerAtomics.h.
        SWIFT_OBJC_BRIDGING_HEADER: Sources/AudioMixer-Bridging-Header.h
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Раньше team ID жил только в сгенерированном pbxproj, и каждый
        # `xcodegen generate` его терял. Локальные сборки идут с ad-hoc
        # подписью и переопределяют DEVELOPMENT_TEAM пустым — на них это
        # не влияет; ключ нужен для сборки из Xcode.
        "DEVELOPMENT_TEAM[sdk=macosx*]": RNXG5JFSA6
    dependencies:
      - sdk: CoreAudio.framework
      - sdk: AudioToolbox.framework
      - sdk: ServiceManagement.framework
      - sdk: Accelerate.framework
