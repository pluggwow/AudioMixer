# XcodeGen-манифест. Позволяет получить .xcodeproj одной командой,
# не держа бинарный проектный файл в git.
#
#   brew install xcodegen && xcodegen generate && open AudioMixer.xcodeproj

name: AudioMixer
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "14.4"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.4"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_ENTITLEMENTS: Resources/AudioMixer.entitlements
    ENABLE_APP_SANDBOX: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ARCHS: "$(ARCHS_STANDARD)"   # arm64 + x86_64

targets:
  AudioMixer:
    type: application
    platform: macOS
    sources:
      - path: Sources
    info:
      path: Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.AudioMixer
        PRODUCT_NAME: AudioMixer
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - sdk: CoreAudio.framework
      - sdk: AudioToolbox.framework
      - sdk: ServiceManagement.framework
